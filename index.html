<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="./app.js" defer></script>
    <title>Sebastian's Baptism - January 11, 2026</title>
</head>

<body class="d-flex justify-content-center">
    <audio id="bgMusic" loop>
        <source src="./For This Child - Baby Dedication Song - Ken Blount.mp3" type="audio/mpeg">
    </audio>
    <div class="main-content">
        <header>
            <div id="intro">
                <img src="envelope.jpeg" alt="Invito">
            </div>
            <video id="myVideo" muted playsinline>
                <source src="./Love Instagram Reel in Pink Style.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <video id="introVideo" muted playsinline>
                <source src="./intro.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </header>

        <main>
            <section class="Baptism reveal slide-in-right">
                <div class="d-flex justify-content-center py-5">
                    <img src="./baptism.png">
                </div>
            </section>

            <section class="church">
                <div class="d-flex justify-content-center py-5 reveal slide-in-left">
                    <img src="./church.png">
                </div>

                <div class="d-flex justify-content-center pb-3 reveal slide-in-right">
                    <img class="img w-75" src="./img/33.jpeg">
                </div>
                <div class="d-flex justify-content-center pb-3 reveal slide-in-left">
                    <img class="img w-75" src="./img/12.jpeg">
                </div>
                <div class="d-flex justify-content-center pb-3 reveal slide-in-right">
                    <img class="img w-75" src="./img/27.jpeg">
                </div>
                <div class="d-flex justify-content-center pb-3 reveal slide-in-left">
                    <img class="img w-75" src="./img/28.jpeg">
                </div>

                <div class="carousel-container">
                    <div class="carousel-track">
                        <img src="./img/4.jpeg" alt="Foto 1">
                        <img src="./img/5.jpeg" alt="Foto 2">
                        <img src="./img/6.jpeg" alt="Foto 3">
                        <img src="./img/9.jpeg" alt="Foto 4">
                        <img src="./img/10.jpeg" alt="Foto 5">
                        <img src="./img/19.jpeg" alt="Foto 6">
                        <img src="./img/21.jpeg" alt="Foto 7">
                        <img src="./img/25.jpeg" alt="Foto 7">
                        <!-- puoi duplicare le immagini per loop infinito -->
                         <img src="./img/4.jpeg" alt="Foto 1">
                        <img src="./img/5.jpeg" alt="Foto 2">
                        <img src="./img/6.jpeg" alt="Foto 3">
                        <img src="./img/9.jpeg" alt="Foto 4">
                        <img src="./img/10.jpeg" alt="Foto 5">
                        <img src="./img/19.jpeg" alt="Foto 6">
                        <img src="./img/21.jpeg" alt="Foto 7">
                        <img src="./img/25.jpeg" alt="Foto 7">
                    </div>
                </div>
            </section>

            <section class="celebration reveal slide-in-right">
                <div class="d-flex justify-content-center py-5">
                    <img src="./celebration.png">
                </div>
            </section>
        </main>

        <footer></footer>
    </div>
</body>

</html>
